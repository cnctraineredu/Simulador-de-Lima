<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Limagem Mecânica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 font-sans select-none">

  <!-- Cabeçalho -->
  <header class="text-center py-2 border-b border-slate-800">
    <h1 class="text-xl font-bold tracking-wide text-slate-100">Treino de Limagem</h1>
    <p class="text-xs text-slate-400">Target: 50–60 GPM | Movimento Horizontal Plano</p>
  </header>

  <!-- Painel Visual Principal -->
  <main id="status-card" class="flex-1 flex flex-col justify-center items-center rounded-2xl my-4 p-6 transition-colors duration-300 bg-slate-800 border-2 border-slate-700 shadow-2xl relative overflow-hidden">
    
    <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-700 text-slate-300 mb-4 tracking-wider uppercase">
      Aguardando Início
    </div>

    <!-- Métrica Principal: GPM -->
    <div class="text-center mb-6">
      <span id="gpm-val" class="text-7xl font-extrabold tracking-tight">0</span>
      <span class="text-sm block text-slate-400 mt-1 uppercase tracking-widest font-medium">Golpes / Minuto</span>
    </div>

    <!-- Indicador de Alinhamento / Inclinação -->
    <div class="w-full max-w-xs bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 mb-4 text-center">
      <div class="text-xs text-slate-400 mb-1">Inclinômetro (Nível Vertical)</div>
      <div id="tilt-status" class="text-sm font-bold text-slate-200">Plano ok (0°)</div>
      <div class="w-full bg-slate-800 h-2 rounded-full mt-2 overflow-hidden relative">
        <div id="tilt-bar" class="bg-emerald-500 h-full w-1/2 mx-auto transition-all duration-150"></div>
      </div>
    </div>

    <!-- Mensagem de Feedback -->
    <div id="feedback-msg" class="text-center font-medium text-sm text-slate-300 px-4">
      Toque no botão abaixo e movimente o celular no ritmo de limagem.
    </div>
  </main>

  <!-- Painel de Controles -->
  <footer class="space-y-3 max-w-md mx-auto w-full">
    <button id="btn-toggle" onclick="toggleTreino()" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-95 font-bold text-lg shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Iniciar Treino
    </button>

    <!-- Modo Simulação (Para testar no PC) -->
    <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-slate-400">Simulador Web (para testes sem celular)</span>
        <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" id="sim-toggle" onchange="toggleSimulador()" class="sr-only peer">
          <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600 relative"></div>
        </label>
      </div>

      <div id="sim-controls" class="space-y-2 hidden text-xs">
        <div>
          <label class="flex justify-between text-slate-400">
            <span>Simular Ritmo (GPM):</span>
            <span id="sim-gpm-label" class="font-bold text-white">55 GPM</span>
          </label>
          <input type="range" id="sim-gpm" min="30" max="80" value="55" oninput="atualizarSimulacao()" class="w-full accent-blue-500">
        </div>
        <div class="flex items-center justify-between pt-1">
          <span class="text-slate-400">Simular Desvio Vertical:</span>
          <button id="btn-sim-tilt" onclick="toggleSimTilt()" class="px-3 py-1 bg-slate-700 rounded text-slate-200 font-medium">
            Desvio: Não
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Lógica JavaScript com Áudio Nativo e Vibração -->
  <script>
    let ativo = false;
    let emSimulacao = false;
    let simDesvio = false;

    // Métricas
    let golpes = 0;
    let timestampsGpm = [];
    let gpmAtual = 0;
    let ultimoEixoX = 0;
    let direcaoAnterior = 0;
    let desvioDetectado = false;
    let ultimoApitoErro = 0;

    // Configurações
    const GPM_MIN = 50;
    const GPM_MAX = 60;
    const LIMIAR_ACELERACAO = 2.5;
    const ANGULO_DESVIO_MAX = 15;

    // Web Audio API Nativa (Sintetizador sem necessidade de arquivos de áudio externos)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function emitirBeep(frequencia, duracao) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duracao);
      } catch (e) {
        console.error(e);
      }
    }

    function vibrarAparelho(padrao) {
      if ("vibrate" in navigator) {
        navigator.vibrate(padrao);
      }
    }

    function toggleTreino() {
      initAudio();

      if (emSimulacao) {
        ativo = !ativo;
        atualizarInterfaceBotao();
        return;
      }

      if (!ativo) {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(state => {
              if (state === 'granted') {
                iniciarSensores();
              } else {
                alert('Permissão de movimento negada.');
              }
            })
            .catch(console.error);
        } else {
          iniciarSensores();
        }
      } else {
        pararSensores();
      }
    }

    function iniciarSensores() {
      ativo = true;
      golpes = 0;
      timestampsGpm = [];
      window.addEventListener('devicemotion', processarMovimento);
      atualizarInterfaceBotao();
      vibrarAparelho([100, 50, 100]); // Vibração de confirmação de início
    }

    function pararSensores() {
      ativo = false;
      window.removeEventListener('devicemotion', processarMovimento);
      resetarEstado();
      atualizarInterfaceBotao();
    }

    function processarMovimento(event) {
      if (!ativo) return;

      const acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc) return;

      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;

      // 1. Verificação de Inclinação
      const inclinacao = Math.abs(Math.atan2(y, Math.sqrt(x*x + z*z)) * (180 / Math.PI));
      desvioDetectado = inclinacao > ANGULO_DESVIO_MAX;

      const tiltBar = document.getElementById('tilt-bar');
      const tiltStatus = document.getElementById('tilt-status');
      
      if (desvioDetectado) {
        tiltBar.style.width = '100%';
        tiltBar.className = 'bg-rose-500 h-full mx-auto transition-all duration-150';
        tiltStatus.textContent = `Errou! Inclinação ${Math.round(inclinacao)}°`;
        tiltStatus.className = 'text-sm font-bold text-rose-400';
      } else {
        tiltBar.style.width = '30%';
        tiltBar.className = 'bg-emerald-500 h-full mx-auto transition-all duration-150';
        tiltStatus.textContent = `Plano OK (${Math.round(inclinacao)}°)`;
        tiltStatus.className = 'text-sm font-bold text-emerald-400';
      }

      // 2. Detecção de Golpes no Eixo X
      const deltaX = x - ultimoEixoX;
      let direcaoAtual = 0;

      if (deltaX > LIMIAR_ACELERACAO) direcaoAtual = 1;
      else if (deltaX < -LIMIAR_ACELERACAO) direcaoAtual = -1;

      if (direcaoAtual !== 0 && direcaoAtual !== direcaoAnterior) {
        const agora = Date.now();
        timestampsGpm.push(agora);
        
        timestampsGpm = timestampsGpm.filter(t => agora - t <= 60000);
        gpmAtual = Math.round((timestampsGpm.length / 2) * (60000 / Math.min(60000, agora - (timestampsGpm[0] || agora) + 1)));

        direcaoAnterior = direcaoAtual;

        // Feedback sonoro discreto a cada passada
        emitirBeep(440, 0.05);
      }

      ultimoEixoX = x;
      avaliarRitmoEExibir();
    }

    function avaliarRitmoEExibir() {
      const card = document.getElementById('status-card');
      const badge = document.getElementById('status-badge');
      const msg = document.getElementById('feedback-msg');
      const gpmText = document.getElementById('gpm-val');

      gpmText.textContent = gpmAtual;

      if (!ativo) return;

      const ritmoCorreto = gpmAtual >= GPM_MIN && gpmAtual <= GPM_MAX;
      const movimentoCorreto = ritmoCorreto && !desvioDetectado;

      if (movimentoCorreto) {
        card.className = "flex-1 flex flex-col justify-center items-center rounded-2xl my-4 p-6 transition-colors duration-300 bg-emerald-900/90 border-2 border-emerald-500 shadow-2xl relative overflow-hidden";
        badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500 text-slate-950 mb-4 tracking-wider uppercase";
        badge.textContent = "Movimento Perfeito";
        msg.textContent = "Ótimo! Ritmo entre 50-60 GPM e movimento plano mantido.";
      } else {
        card.className = "flex-1 flex flex-col justify-center items-center rounded-2xl my-4 p-6 transition-colors duration-300 bg-rose-900/90 border-2 border-rose-500 shadow-2xl relative overflow-hidden";
        badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500 text-white mb-4 tracking-wider uppercase";
        badge.textContent = "Incorreto";

        if (desvioDetectado) {
          msg.textContent = "Atenção: Mantenha a lima na horizontal! Desvio vertical detectado.";
        } else if (gpmAtual < GPM_MIN) {
          msg.textContent = `Aumente a velocidade! Ritmo atual (${gpmAtual} GPM) está abaixo de 50.`;
        } else {
          msg.textContent = `Diminua a velocidade! Ritmo atual (${gpmAtual} GPM) está acima de 60.`;
        }

        // Alerta sonoro e tátil de erro (limitado para não poluir)
        const agora = Date.now();
        if (agora - ultimoApitoErro > 1000) {
          emitirBeep(220, 0.2); // Som grave de erro
          vibrarAparelho(200);   // Vibração de erro
          ultimoApitoErro = agora;
        }
      }
    }

    function atualizarInterfaceBotao() {
      const btn = document.getElementById('btn-toggle');
      if (ativo) {
        btn.className = "w-full py-4 rounded-xl bg-rose-600 hover:bg-rose-500 active:scale-95 font-bold text-lg shadow-lg shadow-rose-600/30 transition-all flex items-center justify-center gap-2";
        btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg> Parar Treino`;
      } else {
        btn.className = "w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-95 font-bold text-lg shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2";
        btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Iniciar Treino`;
      }
    }

    function resetarEstado() {
      gpmAtual = 0;
      desvioDetectado = false;
      document.getElementById('gpm-val').textContent = '0';
      document.getElementById('status-card').className = "flex-1 flex flex-col justify-center items-center rounded-2xl my-4 p-6 transition-colors duration-300 bg-slate-800 border-2 border-slate-700 shadow-2xl relative overflow-hidden";
      document.getElementById('status-badge').className = "px-3 py-1 rounded-full text-xs font-semibold bg-slate-700 text-slate-300 mb-4 tracking-wider uppercase";
      document.getElementById('status-badge').textContent = "Aguardando Início";
      document.getElementById('feedback-msg').textContent = "Toque no botão abaixo e movimente o celular no ritmo de limagem.";
    }

    function toggleSimulador() {
      initAudio();
      emSimulacao = document.getElementById('sim-toggle').checked;
      const controls = document.getElementById('sim-controls');
      
      if (emSimulacao) {
        controls.classList.remove('hidden');
        if (ativo) pararSensores();
        atualizarSimulacao();
      } else {
        controls.classList.add('hidden');
        pararSensores();
      }
    }

    function toggleSimTilt() {
      simDesvio = !simDesvio;
      const btn = document.getElementById('btn-sim-tilt');
      btn.textContent = simDesvio ? "Desvio: SIM (Ativo)" : "Desvio: Não";
      btn.className = simDesvio ? "px-3 py-1 bg-rose-600 rounded text-white font-medium" : "px-3 py-1 bg-slate-700 rounded text-slate-200 font-medium";
      atualizarSimulacao();
    }

    function atualizarSimulacao() {
      if (!emSimulacao) return;

      const val = document.getElementById('sim-gpm').value;
      document.getElementById('sim-gpm-label').textContent = `${val} GPM`;

      if (ativo) {
        gpmAtual = parseInt(val, 10);
        desvioDetectado = simDesvio;

        const tiltBar = document.getElementById('tilt-bar');
        const tiltStatus = document.getElementById('tilt-status');
        if (desvioDetectado) {
          tiltBar.style.width = '100%';
          tiltBar.className = 'bg-rose-500 h-full mx-auto transition-all duration-150';
          tiltStatus.textContent = 'Errou! Inclinação > 15°';
          tiltStatus.className = 'text-sm font-bold text-rose-400';
        } else {
          tiltBar.style.width = '30%';
          tiltBar.className = 'bg-emerald-500 h-full mx-auto transition-all duration-150';
          tiltStatus.textContent = 'Plano OK (0°)';
          tiltStatus.className = 'text-sm font-bold text-emerald-400';
        }

        avaliarRitmoEExibir();
      }
    }
  </script>
</body>
</html>
